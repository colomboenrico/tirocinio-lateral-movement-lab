#========Logstasg oputput =======
output.logstash:
   hosts: ["http://opensearch-dashboards:5601"]


#======mqtt===

packetbeat.inputs:
  - type: mqtt
    hosts:
      - tcp://broker:1883
      - ssl://secure_broker:8883
    topics:
      - sample_topic